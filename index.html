<title>Kharcha</title>
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-opsz-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fraunces';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-ext-opsz-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

@font-face{font-family:'Jakarta';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#F3EFE6;--bg2:#EAE4D7;--card:#FFFCF6;--card2:#F7F2E8;--fg:#1A1712;--muted:#80786A;--faint:#B3AA99;--line:#E5DDCD;
  --acc:#1E4A3C;--acc-fg:#F6F1E6;--gold:#A8834A;--gold-soft:#F1E6D2;--pos:#2F7A5B;--pos-soft:#E2EFE7;--bad:#B5432F;--bad-soft:#F6E2DB;--warn:#9A6A12;
  --shadow:0 1px 0 rgba(26,23,18,.04),0 8px 24px -12px rgba(26,23,18,.18);
  --serif:'Fraunces',ui-serif,Georgia,serif;--sans:'Jakarta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0E0E0C;--bg2:#151513;--card:#171715;--card2:#1E1E1B;--fg:#F1ECE1;--muted:#9C9586;--faint:#5E594F;--line:#2A2925;
  --acc:#D4B377;--acc-fg:#16140F;--gold:#D4B377;--gold-soft:#2A2418;--pos:#86C3A3;--pos-soft:#18261F;--bad:#E58B78;--bad-soft:#2E1D19;--warn:#E3B45A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);font-feature-settings:'tnum' 1,'ss01' 1;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
#app{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 18px}
.brand{font-family:var(--serif);font-size:32px;line-height:1;font-weight:560;letter-spacing:-.02em;font-variation-settings:'opsz' 96}
.brand i{font-style:normal;color:var(--gold)}
.sub0{color:var(--muted);font-size:12px;margin:6px 0 0;letter-spacing:.01em}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--pos)}
nav#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:2px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 12px 32px -10px rgba(0,0,0,.35);width:min(440px,calc(100% - 24px))}
nav#nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px 6px;border-radius:16px;font:600 11px/1.2 var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.01em}
nav#nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav#nav button.on{color:var(--fg);background:var(--card2)}
nav#nav button.on svg{stroke:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.hero{background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%);pointer-events:none}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--serif);font-size:44px;line-height:1.05;font-weight:500;letter-spacing:-.025em;margin:8px 0 6px;font-variation-settings:'opsz' 144;font-feature-settings:'lnum' 1}
.big .dec{font-size:.55em;color:var(--muted);letter-spacing:0}
.mid{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.02em;font-variation-settings:'opsz' 72}
.drop{display:block;border:1.5px dashed var(--faint);border-radius:22px;padding:34px 18px;text-align:center;cursor:pointer;background:var(--card);transition:.2s}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.drop .ic{width:52px;height:52px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;margin:0 auto 12px}
.drop .ic svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:6px;letter-spacing:-.01em}
.drop span{color:var(--muted);font-size:13px}
.drop input{display:none}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:10px 16px;border-radius:14px;font:600 13.5px/1.2 var(--sans);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:11px}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=password],select,textarea{font:500 14px var(--sans);color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;max-width:100%;outline:none;appearance:none;-webkit-appearance:none}
select{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;min-height:90px}
.file{padding:14px 0;border-top:1px solid var(--line)}
.file:first-of-type{border-top:0;padding-top:0}
.file .nm{font-weight:600;word-break:break-all;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--pos-soft);color:var(--pos);margin:0 4px 4px 0}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--gold-soft);color:var(--warn)}
.tag.plain{background:var(--card2);color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font-size:11.5px;background:var(--card2);padding:10px;border-radius:12px;max-height:220px;overflow:auto;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:20px;font-weight:500;margin-top:4px;letter-spacing:-.01em;font-variation-settings:'opsz' 48}
.stat .p{font-size:12px;color:var(--muted)}
.alloc{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:4px 0 16px}
.alloc i{display:block;height:100%}
.cat{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.cat:first-of-type{border-top:0}
.cat-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cat .nm{font-weight:600;display:flex;align-items:center;gap:9px}
.cat .nm .sw{width:10px;height:10px;border-radius:3px;flex:none}
.cat .amt{font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:9px;margin:8px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.bar i.over{background:var(--bad)!important}
.cat .sub{font-size:12px;color:var(--muted)}
.cat .sub .o{color:var(--bad);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 4px;border-top:1px solid var(--line);text-align:left}
tr:first-child td{border-top:0}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0;padding-top:0}
td.r,th.r{text-align:right}
tr[data-cardgo]:active,tr[data-persongo]:active,.cat:active{opacity:.6}
.due{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.due:first-of-type{border-top:0;padding-top:0}
.due .cal{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:5px 0}
.due .cal b{display:block;font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.1}
.due .cal span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.due .when{font-size:12px;color:var(--muted)}
.due .when.soon{color:var(--warn);font-weight:600}
.due .when.late{color:var(--bad);font-weight:600}
.due .amt{font-weight:600;text-align:right}
.tx{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0;padding-top:0}
.tx .d{font-size:14px;font-weight:600;word-break:break-word;line-height:1.35}
.tx .m{font-size:12px;color:var(--muted);margin-top:2px}
.tx .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tx .a{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.tx .a.cr{color:var(--pos)}
.tx select{font-size:12.5px;padding:6px 26px 6px 9px;max-width:170px;border-radius:10px;background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%}
.tx .flip{width:26px;height:26px;padding:0;border-radius:8px;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.bgrid{display:grid;grid-template-columns:1fr 130px;gap:8px 10px;align-items:center;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,9,7,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.modal .box .ttl{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:13.5px;font-weight:600;display:none;z-index:40;max-width:90%;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.hide{display:none}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty .mid{color:var(--fg);margin-bottom:6px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.sec h2{margin:0}
.link{color:var(--gold);font-size:12.5px;font-weight:600;background:none;border:0;cursor:pointer;padding:0}
.howto{display:grid;gap:12px;margin-top:4px}
.howto div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
.howto b{flex:none;width:24px;height:24px;border-radius:8px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:12px}
.chg{display:inline-block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.chg.up{color:var(--bad)}.chg.down{color:var(--pos)}
.tchart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.tbar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.tcol i{display:block;width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--gold) 28%,var(--card2))}
.tcol.on i{background:var(--gold)}
.tcol .tv{font-size:11px;font-weight:700}
.tcol .tl{font-size:11px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:first-of-type{border-top:0}
.trow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.trow .amt{font-weight:600;min-width:72px;text-align:right}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;width:54px;flex:none}
.spark i{flex:1;background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:2px}
.selw{position:relative;display:inline-block;min-width:0;max-width:100%;cursor:pointer;border-radius:12px;outline:none}
.selw.grow{flex:1}
.selw>select{width:100%;pointer-events:none;display:block}
.selw:focus-visible>select{border-color:var(--gold)}
.selw:active>select{transform:scale(.98)}
.sheet{position:fixed;inset:0;z-index:35;display:none;align-items:flex-end;justify-content:center;background:rgba(10,9,7,0);transition:background .22s}
.sheet.on{display:flex}
.sheet.in{background:rgba(10,9,7,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-box{width:100%;max-width:520px;max-height:78vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.9,.25,1)}
.sheet.in .sheet-box{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.sheet-head .ttl{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.01em}
.sheet-search{padding:0 4px 10px}.sheet-search input{width:100%}
.sheet-list{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 2px}
.pk-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:13px 12px;color:var(--fg);font:600 15px/1.3 var(--sans);cursor:pointer}
.pk-opt:active{background:var(--card2)}
.pk-opt.on{background:var(--gold-soft)}
.pk-opt .sw{width:12px;height:12px;border-radius:4px;flex:none}
.pk-lbl{display:block}
.pk-sub{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.pk-tick{width:20px;height:20px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pk-opt.on .pk-tick{opacity:1}
body.noscroll{overflow:hidden}
@media(min-width:700px){.sheet{align-items:center}.sheet-box{border-radius:24px;border-bottom:1px solid var(--line);max-height:70vh}}
.paybar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.paybar .mid{margin-top:4px}.paybar .mid.done{color:var(--pos)}
.due{align-items:flex-start}
.due .amt{padding-top:2px}
.due.paid .amt{text-decoration:line-through;color:var(--muted);font-weight:500}
.due.paid .grow>div:first-child{color:var(--muted)}
.due .cal.ok{display:grid;place-items:center;height:46px;background:var(--pos-soft);border-color:transparent}
.due .cal.ok svg{width:22px;height:22px;stroke:var(--pos);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.due .when.paidtxt{color:var(--pos);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer;user-select:none;-webkit-user-select:none;padding:4px 10px 4px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.chk input{position:absolute;opacity:0;width:0;height:0}
.chk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;transition:.15s}
.chk .box svg{width:14px;height:14px;stroke:var(--acc-fg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk input:checked+.box{background:var(--pos);border-color:var(--pos)}
.chk input:checked+.box svg{opacity:1;stroke:#fff}
.chk input:focus-visible+.box{outline:2px solid var(--gold);outline-offset:2px}
.due.paid .chk{color:var(--pos);background:var(--pos-soft);border-color:transparent}
@media(max-width:380px){.big{font-size:38px}.stat .v{font-size:17px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><div class="brand">Kharcha<i>.</i></div><p class="sub0" id="subline">Credit card spends, sorted</p></div>
    <span class="pill"><span class="dot"></span>On-device <span id="ver">v10</span></span>
  </header>

  <section id="v-upload">
    <label class="drop" id="drop">
      <input type="file" id="fileIn" accept=".pdf,application/pdf" multiple>
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
      <b>Add statements</b>
      <span>Pick all your card PDFs at once. Locked PDFs will ask for their password.</span>
    </label>
    <div id="fileList" style="margin-top:14px"></div>
  </section>
  <section id="v-summary" class="hide"></section>

async function extractLines(pdf){

    const rows=[];
    for(const it of items){const y=it.transform[5];const r=rows[rows.length-1];if(r&&Math.abs(r.y-y)<=3)r.items.push(it);else rows.push({y,items:[it]})}

      r.items.sort((a,b)=>a.transform[4]-b.transform[4]);

}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};

const AMT=/(\+\s*|-)?(?:(?:₹|Rs\.?|INR|`|(?<![A-Za-z])C)\s?)?(\d{1,3}(?:,\d{2,3})+\.\d{2}|\d+\.\d{2})(?:\s?(CR|DR|Cr|Dr|cr|dr|C|D)(?![A-Za-z]))?/g;

function parseLines(lines,year){
  const tx=[],skipped=[];let firstTx=-1;
  const isTx=new Set();
  lines.forEach((line0,idx)=>{
    const line=line0.replace(/^.*?\d{1,3}%\s+(?=\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\s)/,'');
    const d=parseDate(line,year);
    if(!d){if(skipped.length<25&&DATEANY.test(line)&&/\d\.\d{2}/.test(line)&&!/months|statement|due date/i.test(line))skipped.push(line);return}
    let rest=line.slice(d.len).replace(/^\s*[|,]?\s*\d{1,2}:\d{2}(:\d{2})?(\s*(AM|PM)\b)?/i,'').trim();
    const all=[...rest.matchAll(AMT)];

    // the INR amount is the first remaining one; later ones are cashback / reward / balance columns
    const pick=ms[0];

    if(desc.length<3){
      const parts=[];const prev=lines[idx-1],next=lines[idx+1];
      if(prev&&!isTx.has(idx-1)&&!parseDate(prev,year)&&!/transaction|date|amount/i.test(prev)&&!AMT.test(prev))parts.push(prev);
      AMT.lastIndex=0;
      if(next&&!parseDate(next,year)&&next.length<90&&!/^page|end of|total|^#/i.test(next)&&!AMT.test(next))parts.push(next);
      AMT.lastIndex=0;

    }

function findDue(lines){
  for(let i=0;i<lines.length;i++){
    const L=lines[i];

    if(!m)continue;
    const after=L.slice(m.index+m[0].length);
    let a=[...after.matchAll(AMT)];
    if(a.length)return amtVal(a[0]);
    const labelLast=!/[A-Za-z]{3,}/.test(after.replace(/\b(rs|inr)\b/ig,''));
    for(let j=i+1;j<Math.min(lines.length,i+6);j++){
      const eq=lines[j].lastIndexOf('=');
      if(eq>=0){const b=[...lines[j].slice(eq).matchAll(AMT)];if(b.length)return amtVal(b[0])}
      a=[...lines[j].matchAll(AMT)];if(a.length)return amtVal(labelLast?a[a.length-1]:a[0])}
  }
  return null;
}

}

function markEmiConversions(tx){
  for(const c of tx){
    if(!c.cr||!/emi/i.test(c.desc)||c.emiPair)continue;
    const d=tx.find(o=>!o.cr&&!o.emiPair&&Math.abs(o.amt+c.amt)<0.01);
    if(d){d.emiPair=c.emiPair=true}
  }
}
async function readStatement(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const task=pdfjsLib.getDocument({data:buf});
  let tried=0,cancelled=false;
  task.onPassword=(update,reason)=>{
    if(tried<pwCache.length){update(pwCache[tried++]);return}
    askPassword(file.name,reason===2).then(r=>{
      if(r===null||r===''){cancelled=true;task.destroy();return}
      if(!pwCache.includes(r))pwCache.push(r);tried=pwCache.length;update(r);
    });
  };
  let pdf;
  try{pdf=await task.promise}catch(e){if(cancelled)throw new Error('Skipped, no password given');throw e}
  const lines=await extractLines(pdf);
  const years={};(lines.join(' ').match(/\b20\d{2}\b/g)||[]).forEach(y=>years[y]=(years[y]||0)+1);
  const year=+Object.keys(years).sort((a,b)=>years[b]-years[a])[0]||new Date().getFullYear();
  const {tx,skipped,firstTx,isTx}=parseLines(lines,year);
  const head=lines.slice(0,firstTx>0?firstTx:60).join(' ');
  const card=detectCard(head,lines.slice(0,120).join(' '),'n'+Date.now(),lines.filter((l,i)=>!isTx.has(i)).join('\n'));
  markEmiConversions(tx);
  return{card,tx,skipped,sample:lines.slice(0,40),pages:pdf.numPages,due:findDue(lines),dueDate:findDueDate(lines),cyc:tx.reduce((m,t)=>t.date>m?t.date:m,'').slice(0,7)};
}
// add a parsed statement's rows to a file record; returns how many were new
function commitRows(rec,info){
  const seen=new Set(state.txns.map(t=>t.sig));let added=0,dup=0;
  for(const t of info.tx){
    const sig=[rec.cardKey,t.date,t.amt,t.desc.toUpperCase().replace(/\s+/g,' ')].join('|');
    if(seen.has(sig)){dup++;continue}
    seen.add(sig);
    state.txns.push({id:nextId++,fileId:rec.id,sig,card:rec.cardKey,date:t.date,desc:t.desc,amt:t.amt,cr:t.cr,cat:t.emiPair?'Ignore':classify(t.desc,t.cr),emi:!!t.emiPair,manual:false,cyc:info.cyc});
    added++;
  }
  return{added,dup};
}
async function handleFiles(list){
  if(!window.pdfjsLib){toast('The PDF reader could not load. Reload the app.');return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
  let added=0,refreshed=0,failed=0;
  for(const f of list){
    const tmp={id:nextId++,name:f.name,size:f.size,status:'reading',n:0,dup:0,skipped:[],sample:[]};
    state.files.push(tmp);renderUpload();
    try{
      const info=await readStatement(f);
      state.files=state.files.filter(x=>x!==tmp);
      // same statement already loaded? (same file, or same card + same cycle)
      const old=state.files.find(x=>x.status==='ok'&&((x.name===f.name&&x.size===f.size)||(x.cardKey===info.card.key&&x.cyc===info.cyc)));
      if(old){
        Object.assign(old,{due:info.due,dueDate:info.dueDate,skipped:info.skipped,sample:info.sample,pages:info.pages,cyc:info.cyc||old.cyc,name:f.name,size:f.size});
        const r=commitRows(old,info);old.n=state.txns.filter(t=>t.fileId===old.id).length;old.dup=0;
        for(const t of state.txns)if(t.fileId===old.id)t.cyc=old.cyc;
        refreshed++;
      }else{
        const rec={id:tmp.id,name:f.name,size:f.size,cardKey:info.card.key,status:'ok',skipped:info.skipped,sample:info.sample,pages:info.pages,due:info.due,dueDate:info.dueDate,cyc:info.cyc};
        if(!store.cardNames[rec.cardKey]){store.cardNames[rec.cardKey]=info.card.name;save()}
        const r=commitRows(rec,info);rec.n=r.added;rec.dup=r.dup;
        state.files.push(rec);added++;
      }
      saveData();
    }catch(e){tmp.status='error';tmp.error=(e&&e.message)||String(e);failed++}
    renderUpload();
  }
  const msg=[];
  if(added)msg.push(added+' statement'+(added>1?'s':'')+' added');
  if(refreshed)msg.push(refreshed===1&&list.length===1?'This statement was already loaded. Details refreshed':refreshed===list.length&&!added?'All '+refreshed+' statements were already loaded. Details refreshed':refreshed+' already loaded, details refreshed');
  if(failed)msg.push(failed+' couldn\'t be read');
  if(msg.length)toast(msg.join(' · '));
  if(state.txns.length){state.tab=added||refreshed?'summary':state.tab;renderAll()}else renderUpload();
}

function analysis(){
  const tx=visible();
  const nm=state.month==='all'?Math.max(1,months().length):1;
  const by={},grp={Needs:0,Wants:0,Other:0},cards={},people={},mer={};
  let total=0,ignored=0,n=0;
  for(const t of tx){
    if(!isSpend(t)){ignored+=Math.abs(t.amt);continue}
    n++;total+=t.amt;
    by[t.cat]=(by[t.cat]||0)+t.amt;
    const g=BUCKET[t.cat]||'Other';grp[g in grp?g:'Other']+=t.amt;
    const cl=cardLabel(t.card);const c=cards[cl]=cards[cl]||{n:0,v:0};c.n++;c.v+=t.amt;
    const pn=personOf(t)||'Unassigned';const p=people[pn]=people[pn]||{n:0,v:0};p.n++;p.v+=t.amt;
    if(!t.cr){const k=merchantKey(t.desc)||t.desc.toUpperCase().slice(0,20);const m=mer[k]=mer[k]||{v:0,n:0};m.v+=t.amt;m.n++}
  }
  const cats=catNames().filter(c=>c!=='Ignore').map(c=>({c,g:BUCKET[c],v:by[c]||0,b:(+store.budgets[c]||0)*nm})).filter(r=>Math.abs(r.v)>0.5||r.b>0).sort((a,b)=>b.v-a.v);
  return{tx,n,total,ignored,grp,cats,
    cards:Object.entries(cards).sort((a,b)=>b[1].v-a[1].v),
    people:Object.entries(people).sort((a,b)=>(a[0]==='Unassigned')-(b[0]==='Unassigned')||b[1].v-a[1].v),
    merchants:Object.entries(mer).sort((a,b)=>b[1].v-a[1].v).slice(0,8)};
}

}

/* ---------- trends ---------- */
function trendData(){
  const cycles=months().slice(0,6).reverse();
  const tot={},cat={};
  for(const t of state.txns){
    if(!isSpend(t)||!cycles.includes(t.cyc))continue;
    tot[t.cyc]=(tot[t.cyc]||0)+t.amt;
    const c=cat[t.cat]=cat[t.cat]||{};c[t.cyc]=(c[t.cyc]||0)+t.amt;
  }
  const last=cycles[cycles.length-1],prev=cycles[cycles.length-2];
  const rows=Object.entries(cat).map(([c,v])=>{
    const a=v[last]||0,b=v[prev]||0;
    const earlier=cycles.slice(0,-1).map(m=>v[m]||0);const avg=earlier.length?earlier.reduce((x,y)=>x+y,0)/earlier.length:0;
    return{c,series:cycles.map(m=>v[m]||0),last:a,prev:b,diff:a-b,pct:b>0?Math.round((a-b)/b*100):null,avg};
  }).filter(r=>r.series.some(x=>Math.abs(x)>0.5)).sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
  return{cycles,tot,rows,last,prev};
}
const shortMon=m=>{const[y,mo]=m.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+" '"+y.slice(2)};
function changeChip(r,prevName){
  if(r.pct===null)return r.last>0?'<span class="chg up">new vs '+esc(prevName)+'</span>':'';
  if(Math.abs(r.pct)<1)return '<span class="chg">same as '+esc(prevName)+'</span>';
  return '<span class="chg '+(r.pct>0?'up':'down')+'">'+(r.pct>0?'▲ ':'▼ ')+Math.abs(r.pct)+'% vs '+esc(prevName)+'</span>';
}
function trendsCard(){
  const d=trendData();
  if(d.cycles.length<2)return '<div class="card"><h2>Trends</h2><div class="muted">Trends appear once you add a second month\'s statements. You\'ll see how each category moves from cycle to cycle.</div></div>';
  const mx=Math.max(1,...d.cycles.map(m=>d.tot[m]||0));
  const lt=d.tot[d.last]||0,pv=d.tot[d.prev]||0,pc=pv>0?Math.round((lt-pv)/pv*100):0;
  let h='<div class="card"><div class="sec"><h2>Trends</h2><span class="chg '+(pc>0?'up':pc<0?'down':'')+'">'+(pc>0?'▲ ':pc<0?'▼ ':'')+Math.abs(pc)+'% vs '+esc(shortMon(d.prev))+'</span></div>';
  h+='<div class="tchart">'+d.cycles.map(m=>'<div class="tcol'+(m===d.last?' on':'')+'"><span class="tv">'+fmtK(d.tot[m]||0)+'</span><div class="tbar"><i style="height:'+Math.max(3,(d.tot[m]||0)/mx*100).toFixed(1)+'%"></i></div><span class="tl">'+esc(shortMon(m))+'</span></div>').join('')+'</div>';
  h+='<div class="muted" style="margin:14px 0 4px">Biggest moves, '+esc(shortMon(d.last))+' vs '+esc(shortMon(d.prev))+'</div>';
  for(const r of d.rows.slice(0,8)){
    const smx=Math.max(1,...r.series);
    h+='<div class="trow" data-cat="'+esc(r.c)+'"><span class="sw" style="background:'+catColor(r.c)+'"></span><div class="grow"><div style="font-weight:600">'+esc(r.c)+'</div>'+changeChip(r,shortMon(d.prev))+'</div><div class="spark">'+r.series.map((v,i)=>'<i style="height:'+Math.max(2,v/smx*100).toFixed(0)+'%;'+(i===r.series.length-1?'background:'+catColor(r.c):'')+'"></i>').join('')+'</div><div class="amt">'+fmt(r.last)+'</div></div>';

}

  const out={};

  const el=$('#txTotals');if(!el)return;
  const list=filtered();
  let spend=0,refund=0,left=0;
  for(const t of list){if(!isSpend(t))left+=Math.abs(t.amt);else if(t.amt>0)spend+=t.amt;else refund-=t.amt}
  const f=state.f;
  const title=[f.card,f.cat,f.person==='__none'?'Unassigned':f.person,f.q&&'"'+f.q+'"',f.review&&'needs review'].filter(Boolean).join(' · ')||'All transactions';
  let h='<div class="eyebrow">'+esc(title)+'</div><div class="big">'+money(spend-refund)+'</div>'
   +'<div class="muted">'+esc(periodLabel())+' · '+list.length+' transactions · spends '+fmt(spend)+(refund?' · refunds −'+fmt(refund):'')+(left?' · '+fmt(left)+' payments left out':'')+'</div>';
  if(f.card){
    const files=state.files.filter(x=>x.status==='ok'&&cardLabel(x.cardKey)===f.card&&(state.month==='all'||x.cyc===state.month));
    const dues=files.map(fileDue).filter(d=>d!=null);
    if(dues.length)h+='<div class="muted">Statement due for this card: '+fmt2(dues.reduce((a,b)=>a+b,0))+'</div>';
  }
  if(store.people.length&&list.length)h+='<div class="row" style="margin-top:10px"><span class="muted">Assign all '+list.length+' to</span><select id="bulkPerson" class="grow"><option value="">choose…</option><option value="__none">Nobody (clear)</option>'+store.people.map(p=>'<option>'+esc(p)+'</option>').join('')+'</select></div>';
  el.innerHTML=h;
}

     +(store.people.length?'<select data-pid="'+t.id+'" style="margin-top:4px;font-size:13px;padding:5px 6px;max-width:170px"><option value="">No person</option>'+store.people.map(p=>'<option'+(personOf(t)===p?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select>':'')
     +'</div><div class="r"><div class="a'+(t.cr?' cr':'')+'"><button class="btn flip" data-flip="'+t.id+'" title="Switch debit / credit">±</button>'+(t.cr?'−':'')+fmt2(t.amt)+'</div><select data-id="'+t.id+'">'+cats.map(c=>'<option'+(c===t.cat?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div></div>';

  h+='<div class="card"><h2>Learned rules ('+store.rules.length+')</h2><div class="muted" style="margin-bottom:8px">Any description containing the keyword goes to that category. The newest rule wins. Built-in rules for common merchants still apply after these.</div>';
  store.rules.slice().reverse().forEach((r,j)=>{const i=store.rules.length-1-j;h+='<div class="row" style="padding:5px 0"><span class="grow">'+esc(r.key)+' → <b>'+esc(r.category)+'</b></span><button class="btn sm" data-delrule="'+i+'">Remove</button></div>'});

   +'<div class="row"><button class="btn danger" id="clearData">Clear statements &amp; transactions</button><button class="btn danger" id="resetAll">Reset everything</button></div>'

/* ---------- actions ---------- */
function setCat(id,cat){
  const t=state.txns.find(x=>x.id===id);if(!t)return;
  t.cat=cat;t.manual=true;
  if(store.applySimilar&&cat!=='Ignore'){
    const k=merchantKey(t.desc);
    if(k){
      store.rules=store.rules.filter(r=>r.key!==k);store.rules.push({key:k,category:cat});save();
      let n=0;
      for(const o of state.txns){if(o.id!==t.id&&!o.manual&&o.cr===t.cr&&o.desc.toUpperCase().includes(k)){o.cat=cat;n++}}
      toast('Rule saved: '+k+' → '+cat+(n?' · '+n+' more moved':''));
    }
  }
  saveData();refresh();
}
function reclassifyAuto(){for(const t of state.txns){if(!t.manual&&!t.emi)t.cat=classify(t.desc,t.cr)}}
async function saveFile(name,data){
  const type=name.endsWith('.pdf')?'application/pdf':name.endsWith('.csv')?'text/csv':name.endsWith('.txt')?'text/plain':'application/json';
  const blob=data instanceof Blob?new Blob([data],{type}):new Blob([data],{type});
  try{
    const file=new File([blob],name,{type});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});return true;
    }
  }catch(e){if(e&&e.name==='AbortError')return true}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true;
  }catch(e){return false}
}
async function copyText(s,box){
  try{await navigator.clipboard.writeText(s);toast('Copied');return}catch(e){}
  if(box){box.classList.remove('hide');box.value=s;box.select();toast('Select all and copy')}
}
function backupJson(){return JSON.stringify({kharcha:1,store,data:{nextId,txns:state.txns,files:state.files.filter(f=>f.status==='ok').map(f=>{const o=Object.assign({},f);delete o.sample;return o})}})}
function restore(text){
  const o=JSON.parse(text);
  const s=o.store||o;
  store={rules:Array.isArray(s.rules)?s.rules.filter(r=>r&&typeof r.key==='string'&&typeof r.category==='string'):[],budgets:s.budgets&&typeof s.budgets==='object'?s.budgets:{},cardNames:s.cardNames&&typeof s.cardNames==='object'?s.cardNames:{},cats:Array.isArray(s.cats)?s.cats:null,people:Array.isArray(s.people)?s.people.filter(p=>typeof p==='string'):[],applySimilar:s.applySimilar!==false};
  loadCats();save();
  if(o.data&&Array.isArray(o.data.txns)){state.txns=o.data.txns;state.files=Array.isArray(o.data.files)?o.data.files:[];nextId=Math.max(+o.data.nextId||1,...state.txns.map(t=>t.id+1),...state.files.map(f=>f.id+1),1);saveData()}
}
function goTx(f){state.f=Object.assign({card:'',cat:'',q:'',review:false,file:0,person:''},f);state.limit=100;state.tab='tx';renderTx();showTab();window.scrollTo(0,0)}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-cat],[data-cardgo],[data-persongo],.chip');if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;showTab();window.scrollTo(0,0);return}

  if(t.dataset.cardgo!==undefined){goTx({card:t.dataset.cardgo});return}
  if(t.dataset.persongo!==undefined){goTx({person:t.dataset.persongo});return}
  if(t.dataset.review){goTx({review:true});return}
  if(t.dataset.showfile){state.month='all';goTx({file:+t.dataset.showfile});state.limit=500;renderTxList();renderSummary();return}
  if(t.id==='fFileClr'){state.f.file=0;renderTxTotals();renderTxList();return}
  if(t.dataset.flip){const x=state.txns.find(o=>o.id===+t.dataset.flip);if(x){x.cr=!x.cr;x.amt=-x.amt;if(!x.manual)x.cat=classify(x.desc,x.cr)}saveData();refresh();return}
  if(t.dataset.rmfile){const id=+t.dataset.rmfile;state.txns=state.txns.filter(o=>o.fileId!==id);state.files=state.files.filter(o=>o.id!==id);if(!months().includes(state.month))state.month='all';saveData();renderAll();return}
  if(t.id==='fRev'){state.f.review=!state.f.review;renderTx();return}
  if(t.id==='fSim'){store.applySimilar=!store.applySimilar;save();renderTx();return}
  if(t.id==='more'){state.limit+=100;renderTxList();return}
  if(t.id==='dlPdf'){
    const old=t.textContent;t.disabled=true;t.textContent='Preparing PDF…';
    try{
      if(!window.jspdf)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='jspdf.umd.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('PDF maker could not load'));document.head.appendChild(sc)});
      const blob=await buildPdf();
      const nm='kharcha-report-'+(state.month==='all'?(months()[0]||'all'):state.month)+'.pdf';
      if(!(await saveFile(nm,blob)))toast('Could not save the PDF here');
    }catch(err){toast('PDF failed: '+((err&&err.message)||err))}
    t.disabled=false;t.textContent=old;return}
  if(t.id==='copySum'){copyText(summaryText(),$('#sumBox'));return}
  if(t.id==='dlSum'){if(!(await saveFile('kharcha-summary-'+fileSlug()+'.csv',summaryCsv())))copyText(summaryText(),$('#sumBox'));return}
  if(t.id==='expCsv'){if(!(await saveFile('kharcha-transactions-'+fileSlug()+'.csv',csvText())))toast('Could not download here');return}
  if(t.id==='addCat'){
    const name=$('#newCat').value.trim().replace(/\s+/g,' ');const g=$('#newCatGroup').value;
    if(!name){toast('Type a category name');return}
    if(catNames().some(c=>c.toLowerCase()===name.toLowerCase())){toast(name+' already exists');return}
    const i=CATS.findIndex(c=>c[0]==='Other');CATS.splice(i<0?CATS.length-1:i,0,[name,g]);store.cats=CATS.filter(c=>c[0]!=='Ignore');loadCats();save();renderAll();toast('Added '+name);return}
  if(t.dataset.delcat!==undefined){
    const c=CATS[+t.dataset.delcat];if(!c||c[0]==='Other'||c[0]==='Ignore')return;
    if(!confirm('Remove "'+c[0]+'"? Its transactions move to Other.'))return;
    store.cats=CATS.filter(x=>x[0]!==c[0]&&x[0]!=='Ignore');store.rules=store.rules.filter(r=>r.category!==c[0]);delete store.budgets[c[0]];
    loadCats();for(const x of state.txns)if(x.cat===c[0]){x.cat='Other';x.manual=false}
    reclassifyAuto();save();saveData();renderAll();return}
  if(t.id==='addPerson'){
    const name=$('#newPerson').value.trim().replace(/\s+/g,' ');
    if(!name){toast('Type a name');return}
    if(store.people.some(p=>p.toLowerCase()===name.toLowerCase())){toast(name+' is already added');return}
    store.people.push(name);save();renderAll();return}
  if(t.dataset.delperson!==undefined){
    const p=store.people[+t.dataset.delperson];if(p==null)return;
    if(!confirm('Remove '+p+'? Their transactions become unassigned.'))return;
    store.people.splice(+t.dataset.delperson,1);for(const x of state.txns)if(x.person===p)delete x.person;
    if(state.f.person===p)state.f.person='';save();saveData();renderAll();return}
  if(t.id==='addRule'){
    const k=$('#newRuleKey').value.trim().toUpperCase();const c=$('#newRuleCat').value;
    if(k.length<3){toast('Use at least 3 letters');return}
    store.rules=store.rules.filter(r=>r.key!==k);store.rules.push({key:k,category:c});save();
    let n=0;for(const x of state.txns){if(!x.manual&&!x.emi&&x.desc.toUpperCase().includes(k)&&x.cat!=='Ignore'){x.cat=c;n++}}
    saveData();refresh();toast('Rule saved'+(n?' · '+n+' transactions moved':''));return}
  if(t.dataset.delrule!==undefined){store.rules.splice(+t.dataset.delrule,1);save();reclassifyAuto();saveData();refresh();return}
  if(t.id==='clearData'){
    if(!confirm('Delete all statements and transactions from this phone? Rules, categories, people and budgets stay.'))return;
    state.txns=[];state.files=[];state.month='all';state.f={card:'',cat:'',q:'',review:false,file:0,person:''};saveData();state.tab='upload';renderAll();toast('Statements cleared');return}
  if(t.id==='resetAll'){
    if(!confirm('Reset Kharcha completely? This deletes statements, transactions, rules, categories, people, budgets and card names.'))return;
    try{localStorage.removeItem(LS);localStorage.removeItem(LD)}catch(err){}
    store={rules:[],budgets:{},cardNames:{},cats:null,people:[],applySimilar:true};loadCats();
    state.txns=[];state.files=[];state.month='all';state.f={card:'',cat:'',q:'',review:false,file:0,person:''};nextId=1;state.tab='upload';renderAll();toast('Everything reset');return}
  if(t.id==='dlBackup'){if(!(await saveFile('kharcha-backup.json',backupJson())))copyText(backupJson(),$('#setBox'));return}
  if(t.id==='copyBackup'){copyText(backupJson(),$('#setBox'));return}
  if(t.id==='impSet'){try{restore($('#setBox').value);renderAll();toast('Restored')}catch(err){toast('That did not look like a Kharcha backup')}return}
});

  const t=e.target;
  if(t.id==='fileIn'){const l=[...t.files];t.value='';if(l.length)handleFiles(l);return}
  if(t.dataset.id){setCat(+t.dataset.id,t.value);return}

  if(t.id==='bulkPerson'){const v=t.value;if(!v)return;const list=filtered();for(const x of list){if(v==='__none')delete x.person;else x.person=v}saveData();toast(list.length+' transactions '+(v==='__none'?'cleared':'assigned to '+v));renderSummary();renderTxTotals();renderTxList();return}
  if(t.dataset.catgroup!==undefined){const c=CATS[+t.dataset.catgroup];if(c){c[1]=t.value;store.cats=CATS.filter(x=>x[0]!=='Ignore');loadCats();save();renderSummary()}return}
  if(t.dataset.paid!==undefined){const on=t.checked;for(const f of state.files){if(f.status==='ok'&&f.cyc===t.dataset.cyc&&cardLabel(f.cardKey)===t.dataset.paid){f.paid=on;if(on)f.paidAt=todayIso();else delete f.paidAt}}saveData();renderSummary();toast(on?t.dataset.paid+' marked as paid':t.dataset.paid+' marked as unpaid');return}
  if(t.dataset.due){const f=state.files.find(o=>o.id===+t.dataset.due);if(f){const v=parseFloat(t.value);f.dueOverride=isNaN(v)?null:v;saveData();renderUpload()}return}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&pickSel)closePicker();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('selw')){e.preventDefault();openPicker(e.target.querySelector('select'))}
});
document.addEventListener('input',e=>{
  if(e.target.id!=='pkSearch')return;const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('#pkList .pk-opt').forEach(b=>b.classList.toggle('hide',!!q&&!b.dataset.txt.includes(q)));
});
new MutationObserver(()=>enhanceSelects($('#app'))).observe($('#app'),{childList:true,subtree:true});
enhanceSelects($('#app'));

loadData();
state.tab=state.txns.length?'summary':'upload';
renderAll();

/* ---------- PWA: offline + files shared from other apps (Android) ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>toast('App updated. Reopen to use the new version.'));
}
(async()=>{
  if(!/[?&]shared=1/.test(location.search)||!('caches' in window))return;
  history.replaceState(null,'',location.pathname);
  try{
    const c=await caches.open('shared-files');const keys=await c.keys();const files=[];
    for(const k of keys){const res=await c.match(k);const b=await res.blob();files.push(new File([b],decodeURIComponent(res.headers.get('X-Name')||'statement.pdf'),{type:'application/pdf'}));await c.delete(k)}
    if(files.length)handleFiles(files);
  }catch(e){}
})();
})();
</script>
</body>
